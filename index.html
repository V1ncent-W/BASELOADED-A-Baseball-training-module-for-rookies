<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baseloaded</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="boot-screen" aria-label="Baseloaded 启动界面">
      <div class="upper-field-grid" aria-hidden="true"></div>
      <div class="stadium-grid" aria-hidden="true"></div>
      <div class="scanlines" aria-hidden="true"></div>

      <section class="intro" aria-hidden="true">
        <div class="ball-trails">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="baseball">
          <span class="stitch stitch-left"></span>
          <span class="stitch stitch-right"></span>
        </div>
        <div class="impact-flash"></div>
        <div class="impact-hole"></div>
        <div class="impact">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="glass-burst">
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
        </div>
      </section>

      <section class="title-reveal" aria-label="游戏标题">
        <p class="label">BASEBALL GAME</p>
        <h1 class="game-title" aria-label="BASELOADED">
          <span class="title-face">BASELOADED</span>
        </h1>
      </section>

      <section class="start-menu" aria-label="开始菜单">
        <div class="diamond" aria-hidden="true">
          <span class="base top"></span>
          <span class="base right"></span>
          <span class="base bottom"></span>
          <span class="base left"></span>
          <span class="mound"></span>
        </div>

        <nav class="menu-actions" aria-label="游戏模式">
          <button type="button" data-mode="practice">
            <span class="cursor" aria-hidden="true"></span>
            场面练习
          </button>
          <button type="button" data-mode="rules">
            <span class="cursor" aria-hidden="true"></span>
            规则学习
          </button>
        </nav>
      </section>

      <section class="difficulty-screen difficulty-practice" aria-label="难度选择" hidden>
        <button class="back-button" type="button" aria-label="返回主菜单">
          <span aria-hidden="true">←</span>
          返回
        </button>

        <div class="coach-panel">
          <div class="coach-sprite" aria-hidden="true">
            <span class="cap"></span>
            <span class="cap-letter">R</span>
            <span class="head"></span>
            <span class="mask"></span>
            <span class="body"></span>
            <span class="arm arm-left"></span>
            <span class="arm arm-right"></span>
            <span class="legs"></span>
          </div>
          <div class="speech-box">
            <p data-role-speech>欢迎来到场面练习。</p>
          </div>
        </div>

        <nav class="difficulty-actions" aria-label="选择难度">
          <button type="button" data-difficulty="low">
            <span class="cursor" aria-hidden="true"></span>
            低级难度
          </button>
          <button type="button" data-difficulty="mid">
            <span class="cursor" aria-hidden="true"></span>
            中级难度
          </button>
          <button type="button" data-difficulty="high">
            <span class="cursor" aria-hidden="true"></span>
            高级难度
          </button>
        </nav>
      </section>

      <section class="quiz-screen" aria-label="题目界面" hidden>
        <button class="quiz-back-button" type="button" aria-label="返回难度选择">
          <span aria-hidden="true">←</span>
          返回
        </button>

        <div class="play-panel">
          <div class="play-field" aria-label="棒球场场面模拟">
            <svg class="field-fan" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <clipPath id="fan-clip">
                  <path d="M50 96 L2 48 A67.9 67.9 0 0 1 98 48 Z" />
                </clipPath>
              </defs>
              <path class="fan-outer fan-grass" d="M50 96 L2 48 A67.9 67.9 0 0 1 98 48 Z" />
              <g clip-path="url(#fan-clip)">
                <rect x="0" y="0" width="100" height="100" fill="#173d24" />
                <path class="fan-stripe stripe-a" d="M-8 100 L16 44 L22 44 L-2 100 Z" fill="#2f7547" />
                <path class="fan-stripe stripe-b" d="M10 100 L34 44 L40 44 L16 100 Z" fill="#27653f" />
                <path class="fan-stripe stripe-c" d="M28 100 L52 44 L58 44 L34 100 Z" fill="#2f7547" />
                <path class="fan-stripe stripe-d" d="M46 100 L70 44 L76 44 L52 100 Z" fill="#27653f" />
                <path class="fan-stripe stripe-e" d="M64 100 L88 44 L94 44 L70 100 Z" fill="#2f7547" />
                <path class="fan-stripe stripe-f" d="M82 100 L106 44 L112 44 L88 100 Z" fill="#27653f" />
                <path class="fan-warning" d="M50 96 L12 58 A53.7 53.7 0 0 1 88 58 Z" fill="#8d5b35" />
                <path class="fan-infield" d="M50 92 L33 75 L50 58 L67 75 Z" fill="#9b643f" />
                <path class="fan-infield-shadow" d="M50 92 L38 80 L50 68 L62 80 Z" fill="#704326" />
                <path class="fan-basepaths" d="M50 92 L33 75 M50 92 L67 75 M50 58 L33 75 M50 58 L67 75" />
                <path class="fan-foul" d="M50 96 L2 48" />
                <path class="fan-foul" d="M50 96 L98 48" />
                <path class="fan-arc arc-deep" d="M2 48 A67.9 67.9 0 0 1 98 48" />
                <path class="fan-arc arc-mid" d="M16 62 A48 48 0 0 1 84 62" />
                <path class="fan-arc arc-inner" d="M34 78 A22 22 0 0 1 66 78" />
                <rect class="fan-baseplate home" x="47" y="90" width="6" height="5" />
                <rect class="fan-baseplate first" x="70" y="68" width="5" height="5" />
                <rect class="fan-baseplate second" x="47" y="50" width="5" height="5" />
                <rect class="fan-baseplate third" x="25" y="68" width="5" height="5" />
                <circle class="fan-mound" cx="50" cy="73" r="4.2" />
              </g>
            </svg>
            <div class="field-players" data-field-players></div>
            <span class="ball-path"></span>
            <div class="keyframe-badge">KEY FRAME</div>
            <button class="replay-field-button" type="button">重播</button>
          </div>

          <div class="quiz-mentor">
            <div class="coach-sprite" aria-hidden="true">
              <span class="cap"></span>
              <span class="cap-letter">R</span>
              <span class="head"></span>
              <span class="mask"></span>
              <span class="body"></span>
              <span class="arm arm-left"></span>
              <span class="arm arm-right"></span>
              <span class="legs"></span>
            </div>
            <div class="quiz-speech-box">
              <p data-quiz-speech>看清场面，再做选择。</p>
            </div>
          </div>
        </div>

        <div class="question-panel">
          <p class="question-meta" data-question-meta>低级 1/100</p>
          <h2 data-question-title>题目加载中</h2>
          <div class="answer-actions" data-answer-actions></div>
          <button class="next-question-button" type="button" hidden>下一题</button>
        </div>
      </section>

      <div class="pass-transition" aria-hidden="true">
        <div class="pass-lines">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="pass-ball">
          <span class="stitch stitch-left"></span>
          <span class="stitch stitch-right"></span>
        </div>
      </div>

      <p class="producer-credit">1centw producted</p>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
